<?xml version="1.0" encoding="UTF-8"?>
<!-- Posta LuxOS - vlastni ikona (obalka na modre desce jako ostatni ikony LuxOS/WhiteSur, deska 448/512) -->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5ac8fa"/>
      <stop offset="1" stop-color="#1a6fe0"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e6eefb"/>
    </linearGradient>
    <linearGradient id="flap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d4e2f7"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dy="6"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.28"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- deska: zaobleny ctverec (superelipsa priblizena krivkami) -->
  <path d="M256 32 C420 32 480 92 480 256 C480 420 420 480 256 480 C92 480 32 420 32 256 C32 92 92 32 256 32 Z" fill="url(#plate)"/>
  <path d="M256 32 C420 32 480 92 480 256 L480 262 C478 108 418 46 256 46 C94 46 34 108 32 262 L32 256 C32 92 92 32 256 32 Z" fill="#ffffff" opacity="0.18"/>
  <g filter="url(#shadow)">
    <!-- telo obalky -->
    <rect x="104" y="150" width="304" height="212" rx="22" fill="url(#paper)"/>
    <!-- spodni klopy -->
    <path d="M104 344 L222 252 Q256 228 290 252 L408 344 L408 340 Q408 362 386 362 L126 362 Q104 362 104 340 Z" fill="#dbe7f8"/>
    <!-- horni klopa -->
    <path d="M110 162 Q116 150 132 150 L380 150 Q396 150 402 162 L284 262 Q256 284 228 262 Z" fill="url(#flap)" stroke="#c3d4ee" stroke-width="3" stroke-linejoin="round"/>
  </g>
</svg>
