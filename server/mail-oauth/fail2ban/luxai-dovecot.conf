# Fail2ban: neuspesna prihlaseni do Dovecotu 2.4 (IMAPS 993: heslo i token LuxAI, SASL pro Postfix).
# Instaluje server/mail-oauth/deploy.sh do /etc/fail2ban/filter.d/luxai-dovecot.conf.
#
# Proc vlastni filtr: dovecot.conf z fail2ban 1.1.0 (Debian 13) zna jen format Dovecotu 2.3
# ("Aborted login (auth failed, ...)"), Dovecot 2.4 pise:
#   imap-login: Login aborted: Logged out (auth failed, 1 attempts in 4 secs) (auth_failed):
#       user=<info@lux-ai.cz>, method=XOAUTH2, rip=203.0.113.7, lip=..., TLS, session=<...>
# Kazde neuspesne prihlaseni do IMAP = jeden radek (radky procesu auth se nepocitaji, jinak by se
# pokus pocital dvakrat). SASL pres Postfix (465/587) hlida luxai-postfix-sasl.conf.
# Overeno na skutecnych radcich z Dovecotu 2.4 (server/mail-oauth/tests/test_fail2ban.py).

[INCLUDES]
before = common.conf

[Definition]
_daemon = dovecot
_login = (?:imap|pop3|submission|managesieve)-login
failregex = ^%(__prefix_line)s%(_login)s: (?:Info: )?(?:Login aborted|Aborted login|Disconnected)\b.*\(auth failed, \d+ attempts(?: in \d+ secs)?\)(?: \(auth_failed\))?: user=<[^>]*>, (?:method=\S+, )?rip=<HOST>(?:,|\s*$)
ignoreregex =

journalmatch = _SYSTEMD_UNIT=dovecot.service
