# Fail2ban: neuspesne SASL prihlaseni do Postfix submission (465/587) - heslo i token LuxAI.
# Instaluje server/mail-oauth/deploy.sh do /etc/fail2ban/filter.d/luxai-postfix-sasl.conf.
# Filtr postfix[mode=auth] z fail2ban 1.1 zna jen LOGIN/PLAIN/CRAM-MD5/DIGEST-MD5, ne XOAUTH2/OAUTHBEARER:
#   postfix/submissions/smtpd[123]: warning: unknown[203.0.113.7]: SASL XOAUTH2 authentication failed: ...

[INCLUDES]
before = common.conf

[Definition]
_daemon = postfix(-\w+)?/(?:submissions?|smtps)/smtpd
failregex = ^%(__prefix_line)swarning: [^[]*\[<HOST>\](?::\d+)?: SASL [A-Z0-9-]+ authentication failed\b
ignoreregex = authentication failed: Connection lost to authentication server$

journalmatch = _SYSTEMD_UNIT=postfix.service _SYSTEMD_UNIT=postfix@-.service
