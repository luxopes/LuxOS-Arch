# LuxAI: verejny IMAPS (993) pro Postu LuxOS a SASL pro Postfix submission (465/587). Dovecot 2.4.
# Instaluje server/mail-oauth/deploy.sh do /etc/dovecot/luxai-public.conf (!include_try z local.conf).
# Port 143 zustava jen na loopbacku (Roundcube), globalni "listen" v local.conf se nemeni.

# Certifikat Let's Encrypt pro mail.lux-ai.cz: ziskava ho Caddy, lux-mail-sync-cert ho kopiruje do
# /etc/lux-mail/tls (Postfix ho uz pouziva) a po obnoveni udela i "doveadm reload".
ssl_server_cert_file = /etc/lux-mail/tls/fullchain.pem
ssl_server_key_file = /etc/lux-mail/tls/privkey.pem
ssl_min_protocol = TLSv1.2

service imap-login {
  inet_listener imaps {
    port = 993
    ssl = yes
    listen = *, ::
  }
}

# Postfix (chroot /var/spool/postfix) se pta Dovecotu na SASL: smtpd_sasl_type = dovecot,
# smtpd_sasl_path = private/auth
service auth {
  unix_listener /var/spool/postfix/private/auth {
    mode = 0660
    user = postfix
    group = postfix
  }
}
