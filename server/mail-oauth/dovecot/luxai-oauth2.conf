# LuxAI: prihlaseni do schranek uctem LuxAI (Posta LuxOS) - SASL OAUTHBEARER (RFC 7628) a XOAUTH2.
# Instaluje server/mail-oauth/deploy.sh do /etc/dovecot/luxai-oauth2.conf, vklada ho posledni radek
# local.conf (!include_try luxai-oauth2.conf). Dovecot 2.4.
#
# Token vydava server uctu LuxAI (POST /api/mail/token, nativni klient s relaci uctu); Dovecot ho overi
# introspekci (RFC 7662) na serveru uctu na loopbacku. Mapovani ucet -> schranka je jen na serveru uctu
# (/etc/lux-account-mailboxes.json), takze odebrani pristupu tam plati hned pro nova prihlaseni.
#
# Heslo schranky (passwd-file, pouziva ho Roundcube na 127.0.0.1:143) zustava jen pro loopback:
# allow_nets odmitne PLAIN/LOGIN z internetu (IMAPS 993 i SASL pro Postfix submission).

auth_mechanisms = plain login xoauth2 oauthbearer

passdb passwd-file {
  mechanisms_filter = plain login
  fields {
    allow_nets = 127.0.0.0/8 ::1/128
  }
}

passdb oauth2 {
  mechanisms_filter = xoauth2 oauthbearer
}

oauth2 {
  introspection_mode = post
  # bez prihlasovacich udaju; skutecnou adresu s klientem introspekce (HTTP Basic z URL,
  # http://lux-dovecot:<tajemstvi>@127.0.0.1:3020/oauth/introspect) nastavuje luxai-oauth2-secret.conf
  # (0600 root). Dovecot 2.4 v rezimu post posila Basic jen z URL, ne z client_id/client_secret.
  # Pozor: "doveconf -n" adresu i s tajemstvim vypise - jeho vystup nesdilet bez grep -v introspection_url.
  introspection_url = http://127.0.0.1:3020/oauth/introspect
  # odpoved serveru uctu: {"active": true, "username": "<schranka>", ...}; username musi byt shodne
  # se jmenem v SASL (Posta posila adresu schranky malymi pismeny)
  username_attribute = username
  active_attribute = active
  active_value = true
}

!include luxai-oauth2-secret.conf
