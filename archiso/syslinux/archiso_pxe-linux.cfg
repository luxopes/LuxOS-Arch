LABEL arch_nbd
TEXT HELP
Boot the LuxOS using NBD.
It allows you to install LuxOS or perform system maintenance.
ENDTEXT
MENU LABEL LuxOS (%ARCH%, NBD)
LINUX ::/%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-luxos
INITRD ::/%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-luxos.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% archiso_nbd_srv=${pxeserver} cms_verify=y %KERNEL_PARAMS%
SYSAPPEND 3

LABEL arch_nfs
TEXT HELP
