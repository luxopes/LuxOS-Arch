# LuxOS - pacman
[options]
HoldPkg     = pacman glibc
Architecture = auto
Color
ILoveCandy
CheckSpace
VerbosePkgLists
ParallelDownloads = 10
DownloadUser = alpm
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

# Repozitar LuxOS (docasne lokalni; v budoucnu vzdaleny server pro lux)
[luxos]
SigLevel = Optional TrustAll
Server = file:///opt/luxos-repo

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist
