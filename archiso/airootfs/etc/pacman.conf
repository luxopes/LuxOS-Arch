# LuxOS - pacman
[options]
HoldPkg     = pacman glibc
Architecture = auto
Color
ILoveCandy
CheckSpace
VerbosePkgLists
ParallelDownloads = 10
DownloadUser = alpm
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

# Repozitare LuxOS z ISO (instalator z nich instaluje; nainstalovany system
# pouziva server, viz /usr/share/luxos/installer/pacman.conf)
[luxos]
SigLevel = Optional TrustAll
Server = file:///opt/luxos-repo/$repo/$arch

[luxos-apps]
SigLevel = Optional TrustAll
Server = file:///opt/luxos-repo/$repo/$arch

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist
