# LuxOS live ISO. Bez hooku kms: graficke ovladace a jejich firmware (NVIDIA ~105 MB, AMD ~27 MB)
# se nactou az ze squashfs po startu. Initramfs je tak ~60 MB misto ~230 MB: rychlejsi start z USB
# a Ventoy v beznem rezimu (na skutecnem hardwaru obri initramfs koncil "INIT NOT FOUND").
# Plymouth v initramfs kresli pres simpledrm (framebuffer firmwaru).
HOOKS=(base udev microcode modconf plymouth memdisk archiso archiso_loop_mnt block filesystems keyboard)
COMPRESSION="zstd"
COMPRESSION_OPTIONS=(-19)
