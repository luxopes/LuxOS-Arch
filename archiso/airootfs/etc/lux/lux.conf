# LuxOS Package Manager - live system
# (the installed system uses /usr/share/luxos/installer/lux.conf; format: /usr/share/doc/lux/lux.md)

[general]
architecture = "auto"
color = true
candy = true
verbose = true
# updates: "stable" (releases) | "staging" (test builds before a release - for testers)
channel = "stable"

[downloads]
parallel = 10
check_space = true
user = "alpm"

[security]
signatures = "required"
local_signatures = "optional"
protect = ["lux-engine", "glibc"]

[packages]
aur = true
review_pkgbuild = true
flatpak = true
cache_keep = 2

# ── LuxOS repositories ────────────────────────
# from this ISO (the installer installs from them; signatures are checked
# by the installed system, which downloads from the server)

[repo.luxos]
server = "file:///opt/luxos-repo/$repo/$arch"
signatures = "optional"

[repo.luxos-apps]
server = "file:///opt/luxos-repo/$repo/$arch"
signatures = "optional"

# ── Arch Linux repositories ───────────────────

[repo.core]
mirrors = "/etc/lux/mirrorlist"

[repo.extra]
mirrors = "/etc/lux/mirrorlist"

# ── Additional configuration ──────────────────

[include]
files = ["/etc/lux/conf.d/*.conf"]
