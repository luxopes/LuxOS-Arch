# LuxOS live system - configuration of the lux package manager
# (the installed system uses /usr/share/luxos/installer/lux.conf; format: /usr/share/doc/lux/lux.md)

architecture        auto
parallel-downloads  10
signatures          required
local-signatures    optional
color               on
candy               on
check-space         on
verbose-lists       on
download-user       alpm
protect             lux-engine glibc

# LuxOS repositories from this ISO (the installer installs from them; signatures are checked
# by the installed system, which downloads from the server)
repo luxos
    server      file:///opt/luxos-repo/$repo/$arch
    signatures  optional

repo luxos-apps
    server      file:///opt/luxos-repo/$repo/$arch
    signatures  optional

repo core
    mirrors  /etc/lux/mirrorlist

repo extra
    mirrors  /etc/lux/mirrorlist

include  /etc/lux/conf.d/*.conf
