# LuxOS - konfigurace pacmanu SESTAVOVACIHO hostitele pro mkarchiso (Arch kontejner, ne live system;
# live system: airootfs/etc/lux/lux.conf, nainstalovany: luxos-installer/files/lux.conf)
[options]
HoldPkg     = pacman glibc
Architecture = auto
Color
ILoveCandy
CheckSpace
VerbosePkgLists
ParallelDownloads = 10
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

# Lokalni repozitare z tohoto sestaveni (podpisy overuje az live a nainstalovany system)
[luxos]
SigLevel = Never
Server = file://@LUXOS_REPO@/$repo/$arch

[luxos-apps]
SigLevel = Never
Server = file://@LUXOS_REPO@/$repo/$arch

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist
