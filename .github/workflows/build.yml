# LuxOS - sestaveni na GitHub Actions
#
#   packages: vsechny baliky LuxOS (NEPODEPSANE - podepisuje se jen na pocitaci spravce,
#             soukromy klic LuxOS na GitHubu neni) -> artefakt "packages"
#   iso:      ISO z uz zverejnenych PODEPSANYCH repozitaru (scripts/fetch-published-repo.sh
#             overi podpisy klicem LuxOS) -> artefakt "iso"; kontrolni soucet a podpis ISO
#             vytvori spravce lokalne pred zverejnenim
#   drivers:  overene ovladace [luxos-drivers] (drivers/state/manifest.json; package = seznam pkgbase
#             oddeleny mezerami, prazdne = vsechny; overene zavislosti se pridaji samy). Zdroje se stahuji
#             podle zapichnutych sha256 z manifestu, makepkg bezi bez site. NEPODEPSANE -> artefakt
#             "drivers" (baliky + failed.txt + report.txt + logy); podepisuje a zverejnuje spravce
#   iso-test: vsechny baliky z teto vetve + TEST ISO (nic se nezverejnuje, na zkouseni ve VM).
#             Baliky a databaze podepise jednorazovy klic vytvoreny v behu ("LuxOS TEST key - not for
#             production", plati 30 dni, soukromy klic zanika s kontejnerem); luxos-keyring v ISO
#             veri klici LuxOS i testovacimu, os-release ma VARIANT="TEST build".
#             -> artefakt "iso-test" (luxos-VERZE-TEST-COMMIT-x86_64.iso, SHA256SUMS, verejny testovaci klic), 7 dni
#   channel:  kanal aktualizaci ISO (iso, iso-test). stable = repozitare https://luxos.lux-ai.cz/repo (vydani),
#             staging = neverejny testovaci kanal https://luxos.lux-ai.cz/staging: target iso stahne baliky
#             odtud a live i nainstalovany system ma v /etc/lux/lux.conf channel = "staging"
#             (LUXOS_CHANNEL=staging). Nazev ISO je stejny (luxos-VERZE-x86_64.iso, bez TEST).
name: Build

on:
  workflow_dispatch:
    inputs:
      target:
        description: What to build
        type: choice
        options: [iso, packages, one, drivers, iso-test]
        default: iso
      package:
        description: "Package for target 'one' (directory in packages/ or packages/apps/); for 'drivers' space-separated pkgbases (empty = all verified)"
        type: string
        default: ""
      channel:
        description: "Update channel of the ISO (iso, iso-test): stable = published releases, staging = test builds before a release"
        type: choice
        options: [stable, staging]
        default: stable

permissions:
  contents: read

concurrency:
  group: build-${{ inputs.target }}-${{ inputs.channel }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # iso-test stavi vsechny baliky i ISO v jednom behu (limit GitHubu je 6 h)
    timeout-minutes: ${{ inputs.target == 'iso-test' && 350 || 300 }}
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL \
                      /usr/local/share/boost /usr/local/.ghcup /usr/share/swift
          sudo docker image prune -af >/dev/null
          # iso-test potrebuje misto pro vsechny zdroje, baliky i pracovni adresar mkarchiso
          if [ "${{ inputs.target }}" = iso-test ]; then
            sudo rm -rf /opt/hostedtoolcache /usr/local/lib/node_modules /usr/lib/jvm /opt/microsoft \
                        /opt/google /opt/az /usr/local/share/chromium /usr/local/share/powershell \
                        /usr/share/miniconda /opt/pipx
          fi
          df -h / /mnt

      - uses: actions/checkout@v4

      - name: Signed packages from luxos.lux-ai.cz
        if: inputs.target == 'iso'
        run: |
          if [ "${{ inputs.channel }}" = staging ]; then
            scripts/fetch-published-repo.sh https://luxos.lux-ai.cz/staging
          else
            scripts/fetch-published-repo.sh
          fi

      - name: Build
        env:
          # ./build.sh packages stahuje jadro z luxopes/luxos-kernel (gh + overeni attestace)
          GH_TOKEN: ${{ github.token }}
          PKG: ${{ inputs.package }}
          # kanal aktualizaci live a nainstalovaneho systemu (jen ISO; build.sh ho preda do kontejneru)
          LUXOS_CHANNEL: ${{ (inputs.target == 'iso' || inputs.target == 'iso-test') && inputs.channel || '' }}
        run: |
          if [ "${{ inputs.target }}" = one ]; then
            case "$PKG" in ''|*[!A-Za-z0-9._+-]*) echo "Bad package name: '$PKG'" >&2; exit 1 ;; esac
            ./build.sh one "$PKG"
          elif [ "${{ inputs.target }}" = drivers ]; then
            case "$PKG" in *[!A-Za-z0-9._+\ -]*) echo "Bad package list: '$PKG'" >&2; exit 1 ;; esac
            # shellcheck disable=SC2086  # seznam baliku oddeleny mezerami
            ./build.sh drivers $PKG
          else
            ./build.sh "${{ inputs.target }}"
          fi

      - name: Checksums
        if: always()
        run: |
          cd out
          case "${{ inputs.target }}" in
            iso) sha256sum luxos-*.iso > SHA256SUMS ;;
            iso-test) sha256sum luxos-*-TEST-*-x86_64.iso luxos-test-key.asc > SHA256SUMS ;;
            one) find single -name '*.pkg.tar.zst' -print0 | xargs -0 sha256sum > SHA256SUMS ;;
            drivers)
              find drivers-repo/pkgs -name '*.pkg.tar.zst' -print0 | xargs -0 -r sha256sum > SHA256SUMS
              cp drivers/fetch-failed.txt drivers-repo/ 2>/dev/null || true
              { echo "Built packages: $(grep -c . SHA256SUMS || true)"
                echo "Failed pkgbases: $(grep -c . drivers-repo/failed.txt || true)"
                echo; cat drivers-repo/failed.txt 2>/dev/null || true
                echo; echo "Source fetch problems:"; cat drivers-repo/fetch-failed.txt 2>/dev/null || true
              } > drivers-repo/report.txt
              cat drivers-repo/report.txt
              # jeden archiv: nazvy baliku s epochou obsahuji ":" a upload-artifact je neprijme
              tar -cf drivers-ci.tar SHA256SUMS drivers-repo/pkgs drivers-repo/built drivers-repo/failed.txt \
                  drivers-repo/report.txt $(ls -d drivers-repo/logs drivers-repo/fetch-failed.txt 2>/dev/null) ;;
            *)   find repo -name '*.pkg.tar.zst' -print0 | xargs -0 sha256sum > SHA256SUMS ;;
          esac
          cat SHA256SUMS | head -60

      - name: Upload ISO
        if: inputs.target == 'iso'
        uses: actions/upload-artifact@v4
        with:
          name: iso
          path: |
            out/luxos-*.iso
            out/SHA256SUMS
          compression-level: 0
          retention-days: 14

      - name: Upload TEST ISO
        if: inputs.target == 'iso-test'
        uses: actions/upload-artifact@v4
        with:
          name: iso-test
          path: |
            out/luxos-*-TEST-*-x86_64.iso
            out/luxos-test-key.asc
            out/SHA256SUMS
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Upload packages
        if: inputs.target == 'packages'
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: |
            out/repo/*/x86_64/*.pkg.tar.zst
            out/SHA256SUMS
          compression-level: 0
          retention-days: 14

      - name: Upload drivers
        if: always() && inputs.target == 'drivers'
        uses: actions/upload-artifact@v4
        with:
          name: drivers
          path: |
            out/drivers-ci.tar
            out/drivers-repo/report.txt
          compression-level: 0
          retention-days: 14

      - name: Upload single package
        if: inputs.target == 'one'
        uses: actions/upload-artifact@v4
        with:
          name: single
          path: |
            out/single/*.pkg.tar.zst
            out/SHA256SUMS
          compression-level: 0
          retention-days: 14
