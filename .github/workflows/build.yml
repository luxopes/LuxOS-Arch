# LuxOS - sestaveni na GitHub Actions
#
#   packages: vsechny baliky LuxOS (NEPODEPSANE - podepisuje se jen na pocitaci spravce,
#             soukromy klic LuxOS na GitHubu neni) -> artefakt "packages"
#   iso:      ISO z uz zverejnenych PODEPSANYCH repozitaru (scripts/fetch-published-repo.sh
#             overi podpisy klicem LuxOS) -> artefakt "iso"; kontrolni soucet a podpis ISO
#             vytvori spravce lokalne pred zverejnenim
name: Build

on:
  workflow_dispatch:
    inputs:
      target:
        description: What to build
        type: choice
        options: [iso, packages]
        default: iso

permissions:
  contents: read

concurrency:
  group: build-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL \
                      /usr/local/share/boost /usr/local/.ghcup /usr/share/swift
          sudo docker image prune -af >/dev/null
          df -h /

      - uses: actions/checkout@v4

      - name: Signed packages from luxos.lux-ai.cz
        if: inputs.target == 'iso'
        run: scripts/fetch-published-repo.sh

      - name: Build
        env:
          # ./build.sh packages stahuje jadro z luxopes/luxos-kernel (gh + overeni attestace)
          GH_TOKEN: ${{ github.token }}
        run: ./build.sh ${{ inputs.target }}

      - name: Checksums
        run: |
          cd out
          if [ "${{ inputs.target }}" = iso ]; then sha256sum luxos-*.iso > SHA256SUMS; else
            find repo -name '*.pkg.tar.zst' -print0 | xargs -0 sha256sum > SHA256SUMS; fi
          cat SHA256SUMS | head -60

      - name: Upload ISO
        if: inputs.target == 'iso'
        uses: actions/upload-artifact@v4
        with:
          name: iso
          path: |
            out/luxos-*.iso
            out/SHA256SUMS
          compression-level: 0
          retention-days: 14

      - name: Upload packages
        if: inputs.target == 'packages'
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: |
            out/repo/*/x86_64/*.pkg.tar.zst
            out/SHA256SUMS
          compression-level: 0
          retention-days: 14
