# LuxOS (luxos-care) - hook "luxos-snapshot" do kazdeho systemd initramfs: start snimku systemu
# z nabidky zavadece (systemd.volatile=overlay). Live ISO (bez systemd hooku) ho nema.
if [[ " ${HOOKS[*]} " == *" systemd "* && " ${HOOKS[*]} " != *" luxos-snapshot "* ]]; then
    HOOKS+=(luxos-snapshot)
fi
