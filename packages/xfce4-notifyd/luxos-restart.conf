# LuxOS - oznameni se po ukonceni xfce4-notifyd vrati sama
# Pojistka earlyoom ho pri nedostatku pameti ukoncuje SIGTERM; to systemd bere jako ciste ukonceni
# (sluzba jen skonci, Restart=no). Spousteni pres D-Bus pak muze viset (sbernice ceka na start, ktery
# uz neprijde) a aplikace, ktere posilaji oznameni synchronne, zamrzaji po 25 s.
# Proto: po SIGTERM/SIGKILL apod. znovu spustit za 2 s. Ciste "exit 0" (jiny server oznameni uz
# jmeno vlastni) ani chybovy kod (konec sezeni bez displeje) restart nevyvola; systemctl stop take ne.
[Unit]
StartLimitIntervalSec=60
StartLimitBurst=10

[Service]
Restart=on-abnormal
RestartForceExitStatus=SIGTERM
RestartSec=2
