# LuxOS - greetd s konfiguraci LuxOS (balik luxos-greetd); po startu systemu navazuje na splash jako LightDM
[Unit]
After=systemd-user-sessions.service plymouth-quit-wait.service
Conflicts=getty@tty1.service
After=getty@tty1.service

[Service]
ExecStart=
ExecStart=/usr/bin/greetd --config /etc/greetd/luxos.toml
