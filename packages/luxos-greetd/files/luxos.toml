# LuxOS - greetd (balik luxos-greetd): prihlasovaci obrazovka luxos-greeter pod luxwm --greeter na VT 1.
# luxos-greetd.service ho cte (greetd --config); config.toml baliku greetd
# zustava beze zmeny. Navrat k LightDM: odebrat balik luxos-greetd (viz docs/developers/wayland-session.md).
[terminal]
vt = 1

[general]
service = "greetd"

[default_session]
command = "/usr/lib/luxos/luxos-greeter-session"
user = "greeter"
