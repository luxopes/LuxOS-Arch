# Lux Guard - clamd na vyzadani (luxos-guard-clamd.service). Soubory dostava jen jako otevrene popisovace
# od luxos-guard (FILDES), sam nic necte ani neprochazi.
LocalSocket /run/luxos-guard-clamd/clamd.sock
LocalSocketMode 600
Foreground yes
DatabaseDirectory /var/lib/clamav
# Foreground: zaznamy jdou na stderr do zurnalu (LogSyslog by je zdvojil)
LogSyslog no
LogTime no
# stary pocitac: malo vlaken, pri obnove databaze se nedrzi dve kopie v pameti
MaxThreads 2
ConcurrentDatabaseReload no
SelfCheck 3600
MaxFileSize 200M
MaxScanSize 400M
StreamMaxLength 200M
ExitOnOOM yes
