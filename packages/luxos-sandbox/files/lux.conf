# LuxOS Sandbox - konfigurace spravce baliku pro sandbox (format lux.conf, viz /usr/share/doc/lux/lux.md).
# luxos-sandbox-helper z ni vygeneruje konfiguraci pro vytvoreni sandboxu (pacstrap) a /etc/pacman.conf
# uvnitr sandboxu: sandbox je minimalni Arch Linux s vlastnim spravcem baliku Archu (balik pacman),
# oddeleny od systemu LuxOS. Zrcadla se pri vytvoreni prevezmou z /etc/lux/mirrorlist.
# Jen oficialni repozitare Arch Linuxu; zadne repozitare LuxOS ani AUR.

architecture        auto
parallel-downloads  5
signatures          required
local-signatures    optional
color               off
candy               off
check-space         on
verbose-lists       off
# v sandboxu je jen jedno UID (falesny root): prepnuti na uzivatele alpm by selhalo,
# stahovani tak bezi jako falesny root a bez sandboxu stahovani
download-user       none
download-sandbox    off
# uvnitr sandboxu je spravcem baliku balik pacman z Archu
protect             pacman glibc

# Mensi sandbox: bez manualovych stranek, dokumentace a cizich prekladu
no-extract  usr/share/man/* usr/share/info/* usr/share/doc/* usr/share/gtk-doc/*
no-extract  usr/share/help/* !usr/share/help/C/* !usr/share/help/en*
no-extract  usr/share/locale/* !usr/share/locale/en*/* !usr/share/locale/cs/* !usr/share/locale/locale.alias

repo core
    mirrors  /etc/lux/mirrorlist

repo extra
    mirrors  /etc/lux/mirrorlist
