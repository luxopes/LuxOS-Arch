# LuxOS Sandbox - pacman.conf uvnitr sandboxu (a pro pacstrap pri vytvareni)
# Jen oficialni repozitare Arch Linuxu; zadne repozitare LuxOS ani AUR.
# DownloadUser chybi zamerne: v sandboxu je jen jedno UID (falesny root),
# prepnuti na uzivatele alpm by selhalo. Stahovani tak bezi jako falesny root.

[options]
HoldPkg     = pacman glibc
Architecture = auto
CheckSpace
ParallelDownloads = 5
DisableSandbox
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

# Mensi sandbox: bez manualovych stranek, dokumentace a cizich prekladu
[options]
NoExtract  = usr/share/man/* usr/share/info/* usr/share/doc/* usr/share/gtk-doc/*
NoExtract  = usr/share/help/* !usr/share/help/C/* !usr/share/help/en*
NoExtract  = usr/share/locale/* !usr/share/locale/en*/* !usr/share/locale/cs/* !usr/share/locale/locale.alias
