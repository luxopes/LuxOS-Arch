// LuxOS - privilegovane nastaveni Firefoxu (autoconfig, zapina defaults/pref/luxos-autoconfig.js).
// 1) Okna prohlizece dostanou styl luxos/titlebar.css (tlacitka okna jako barevna kolecka LuxOS) jako
//    dalsi styl autora jen pro chrome://browser/content/browser.xhtml - weby ani userChrome.css
//    uzivatele se nemeni. Volba luxos.titlebar.trafficlights styl vypne/zapne hned ve vsech oknech.
// 2) Uvitaci stranka LuxOS (luxos/welcome/index.html) pri prvnim spusteni noveho profilu v jazyce
//    systemu; jeji tlacitko "Importovat" otevre pruvodce importem Firefoxu (jen z teto mistni stranky).
// Jakakoli chyba (zmena rozhrani v nove verzi Firefoxu) jen ponecha puvodni chovani Firefoxu:
// vse je v try/catch, aby Firefox nehlasil chybu konfiguracniho souboru.
try {
  (function () {
    const { classes: Cc, interfaces: Ci, utils: Cu } = Components;
    const Services = globalThis.Services ||
      ChromeUtils.importESModule("resource://gre/modules/Services.sys.mjs").Services;
    const report = (e) => {
      try {
        Cu.reportError(e);
      } catch (e2) {}
    };
    const dir = Services.dirsvc.get("GreD", Ci.nsIFile);
    dir.append("luxos");
    if (!dir.exists()) {
      return;
    }
    const BROWSER = "chrome://browser/content/browser.xhtml";

    // ---- uvitaci stranka: jazyk podle systemu (LC_ALL, LC_MESSAGES, LANG), jinak podle Firefoxu ----
    let welcome = "";
    try {
      const page = dir.clone();
      page.append("welcome");
      page.append("index.html");
      if (page.exists()) {
        welcome = Services.io.newFileURI(page).spec;
        let lang = "";
        for (const v of ["LC_ALL", "LC_MESSAGES", "LANG"]) {
          const val = Services.env.get(v);
          if (val && val !== "C" && val !== "POSIX" && !val.startsWith("C.")) {
            lang = val;
            break;
          }
        }
        lang = (lang || Services.locale.appLocaleAsBCP47 || "en").split(/[._@-]/)[0].toLowerCase();
        defaultPref("startup.homepage_welcome_url", welcome + "?lang=" + encodeURIComponent(lang));
      }
    } catch (e) {
      report(e);
    }

    // ---- tlacitka okna ----
    const PREF = "luxos.titlebar.trafficlights";
    const css = dir.clone();
    css.append("titlebar.css");
    // resource:// (ne file://): jen tak smi styl pouzit -moz-* media dotazy chrome (strana tlacitek)
    const res = Services.io.getProtocolHandler("resource").QueryInterface(Ci.nsIResProtocolHandler);
    res.setSubstitution("luxos", Services.io.newFileURI(dir));
    const uri = "resource://luxos/titlebar.css";
    const AUTHOR = Ci.nsIDOMWindowUtils.AUTHOR_SHEET;
    const enabled = () => {
      try {
        return Services.prefs.getBoolPref(PREF, true);
      } catch (e) {
        return true;
      }
    };
    const set = (win, on) => {
      try {
        const wu = win.windowUtils;
        // nikdy dvakrat stejny styl (prepinani volby tam a zpet)
        wu.removeSheetUsingURIString(uri, AUTHOR);
        if (on && css.exists()) {
          wu.loadSheetUsingURIString(uri, AUTHOR);
        }
      } catch (e) {
        report(e);
      }
    };

    // import z Chrome/Edge: odkaz #import... na mistni uvitaci strance (weby na file:// navigovat nesmi)
    const importHook = (win) => {
      win.addEventListener("load", () => {
        try {
          win.gBrowser.addTabsProgressListener({
            onLocationChange(browser, progress, request, location) {
              try {
                if (welcome && location && location.spec.startsWith(welcome) &&
                    /^import-?\d*$/.test(location.ref || "") && progress.isTopLevel) {
                  const MU = win.MigrationUtils;
                  MU.showMigrationWizard(win, { entrypoint: MU.MIGRATION_ENTRYPOINTS.FILE_MENU });
                }
              } catch (e) {
                report(e);
              }
            },
          });
        } catch (e) {
          report(e);
        }
      }, { once: true });
    };

    // co nejdriv (korenovy prvek vlozen, jeste pred prvnim vykreslenim) - zadne probliknuti sedych tlacitek
    Services.obs.addObserver({
      observe(doc) {
        try {
          if (doc && doc.documentURI === BROWSER && doc.defaultView) {
            if (enabled()) {
              set(doc.defaultView, true);
            }
            importHook(doc.defaultView);
          }
        } catch (e) {
          report(e);
        }
      },
    }, "document-element-inserted");
    Services.prefs.addObserver(PREF, {
      observe() {
        const on = enabled();
        for (const win of Services.wm.getEnumerator("navigator:browser")) {
          set(win, on);
        }
      },
    });
  })();
} catch (e) {
  try {
    Components.utils.reportError(e);
  } catch (e2) {}
}
