// LuxOS - privilegovane nastaveni Firefoxu (autoconfig, zapina defaults/pref/luxos-autoconfig.js).
// 1) Okna prohlizece dostanou styl luxos/titlebar.css (tlacitka okna jako barevna kolecka LuxOS) jako
//    dalsi styl autora jen pro chrome://browser/content/browser.xhtml - weby ani userChrome.css
//    uzivatele se nemeni. Volba luxos.titlebar.trafficlights styl vypne/zapne hned ve vsech oknech.
// 2) Uvitaci stranka LuxOS (luxos/welcome/index.html) pri prvnim spusteni noveho profilu v jazyce
//    systemu; jeji tlacitko "Importovat" otevre pruvodce importem Firefoxu a dlazdice Obchod, LuxAI,
//    Klavesove zkratky a Nahlasit problem otevrou aplikace LuxOS (jen z teto mistni stranky).
// Jakakoli chyba (zmena rozhrani v nove verzi Firefoxu) jen ponecha puvodni chovani Firefoxu:
// vse je v try/catch, aby Firefox nehlasil chybu konfiguracniho souboru.
try {
  (function () {
    const { classes: Cc, interfaces: Ci, utils: Cu } = Components;
    const Services = globalThis.Services ||
      ChromeUtils.importESModule("resource://gre/modules/Services.sys.mjs").Services;
    const report = (e) => {
      try {
        Cu.reportError(e);
      } catch (e2) {}
    };
    const dir = Services.dirsvc.get("GreD", Ci.nsIFile);
    dir.append("luxos");
    if (!dir.exists()) {
      return;
    }
    const BROWSER = "chrome://browser/content/browser.xhtml";

    // ---- uvitaci stranka: jazyk podle systemu (LC_ALL, LC_MESSAGES, LANG), jinak podle Firefoxu ----
    let welcome = "";
    let lang = "";
    try {
      const page = dir.clone();
      page.append("welcome");
      page.append("index.html");
      if (page.exists()) {
        welcome = Services.io.newFileURI(page).spec;
        for (const v of ["LC_ALL", "LC_MESSAGES", "LANG"]) {
          const val = Services.env.get(v);
          if (val && val !== "C" && val !== "POSIX" && !val.startsWith("C.")) {
            lang = val;
            break;
          }
        }
        lang = (lang || Services.locale.appLocaleAsBCP47 || "en").split(/[._@-]/)[0].toLowerCase();
        defaultPref("startup.homepage_welcome_url", welcome + "?lang=" + encodeURIComponent(lang));
      }
    } catch (e) {
      report(e);
    }

    // ---- tlacitka okna ----
    const PREF = "luxos.titlebar.trafficlights";
    const css = dir.clone();
    css.append("titlebar.css");
    // resource:// (ne file://): jen tak smi styl pouzit -moz-* media dotazy chrome (strana tlacitek)
    const res = Services.io.getProtocolHandler("resource").QueryInterface(Ci.nsIResProtocolHandler);
    res.setSubstitution("luxos", Services.io.newFileURI(dir));
    const uri = "resource://luxos/titlebar.css";
    const AUTHOR = Ci.nsIDOMWindowUtils.AUTHOR_SHEET;
    const enabled = () => {
      try {
        return Services.prefs.getBoolPref(PREF, true);
      } catch (e) {
        return true;
      }
    };
    const set = (win, on) => {
      try {
        const wu = win.windowUtils;
        // nikdy dvakrat stejny styl (prepinani volby tam a zpet)
        wu.removeSheetUsingURIString(uri, AUTHOR);
        if (on && css.exists()) {
          wu.loadSheetUsingURIString(uri, AUTHOR);
        }
      } catch (e) {
        report(e);
      }
    };

    // aplikace z dlazdic uvitaci stranky: pevny seznam, bez argumentu; neni-li aplikace nainstalovana,
    // otevre se jeji stranka napovedy na webu LuxOS. luxos.welcome.appdir jen pro testy (jinak /usr/bin).
    // (ceska verze webu jen u stranek, ktere cesky existuji)
    const docs = "https://luxos.lux-ai.cz/" + (lang === "cs" ? "cs/" : "") + "docs/luxos/";
    const APPS = {
      store: ["luxos-store", "https://luxos.lux-ai.cz/docs/luxos/store.html"],
      luxai: ["luxai", docs + "luxai.html"],
      keys: ["luxos-shortcuts", docs + "shortcuts.html"],
      report: ["luxos-feedback", "https://github.com/luxopes/LuxOS-Arch/issues"],
    };
    const openApp = (win, name) => {
      const app = APPS[name];
      if (!app) {
        return;
      }
      try {
        const bin = Cc["@mozilla.org/file/local;1"].createInstance(Ci.nsIFile);
        bin.initWithPath(Services.prefs.getStringPref("luxos.welcome.appdir", "/usr/bin"));
        bin.append(app[0]);
        if (bin.exists() && bin.isExecutable()) {
          const proc = Cc["@mozilla.org/process/util;1"].createInstance(Ci.nsIProcess);
          proc.init(bin);
          proc.runAsync([], 0);
          return;
        }
      } catch (e) {
        report(e);
      }
      win.openWebLinkIn(app[1], "tab");
    };
    // akce jen z cerstveho odkazu (#import-<cas>, #open-<aplikace>-<cas>) a kazda jen jednou:
    // tlacitko Zpet ani obnovena relace ji neopakuji
    const done = new Set();
    const fresh = (ref, stamp) => {
      const t = Number(stamp);
      if (done.has(ref) || !(Math.abs(Date.now() - t) < 60000)) {
        return false;
      }
      done.add(ref);
      return true;
    };

    // spojeni se strankou: na #hello-<cas> odpovi adresou #ok-<cas>[-ubo] (jen zmena # ve strance, bez
    // historie) - stranka tak vi, ze dlazdice a import muze predat Firefoxu (bez odpovedi, napr. ve
    // Firefoxu spustenem pred aktualizaci LuxOS, vedou na web) a ze je zapnuty uBlock Origin
    const answer = (browser, location, stamp) => {
      const send = (flags) => {
        try {
          browser.fixupAndLoadURIString(location.specIgnoringRef + "#ok-" + stamp + flags, {
            triggeringPrincipal: Services.scriptSecurityManager.getSystemPrincipal(),
            loadFlags: Ci.nsIWebNavigation.LOAD_FLAGS_REPLACE_HISTORY,
          });
        } catch (e) {
          report(e);
        }
      };
      try {
        const { AddonManager } = ChromeUtils.importESModule("resource://gre/modules/AddonManager.sys.mjs");
        AddonManager.getAddonByID("uBlock0@raymondhill.net").then(
          (a) => send(a && a.isActive ? "-ubo" : ""), () => send(""));
      } catch (e) {
        send("");
      }
    };

    // import z Chrome/Edge a aplikace: odkazy # na mistni uvitaci strance (weby na file:// navigovat nesmi)
    const importHook = (win) => {
      win.addEventListener("load", () => {
        try {
          win.gBrowser.addTabsProgressListener({
            onLocationChange(browser, progress, request, location) {
              try {
                if (!welcome || !location || !location.spec.startsWith(welcome) || !progress.isTopLevel) {
                  return;
                }
                const ref = location.ref || "";
                // "#import" bez casu = stranka bez skriptu (jen jednou za beh Firefoxu)
                let m = /^import(?:-(\d+))?$/.exec(ref);
                if (m && fresh(ref, m[1] || Date.now())) {
                  const MU = win.MigrationUtils;
                  MU.showMigrationWizard(win, { entrypoint: MU.MIGRATION_ENTRYPOINTS.FILE_MENU });
                }
                m = /^hello-(\d+)$/.exec(ref);
                if (m && fresh(ref, m[1])) {
                  answer(browser, location, m[1]);
                }
                m = /^open-([a-z]+)-(\d+)$/.exec(ref);
                if (m && fresh(ref, m[2])) {
                  openApp(win, m[1]);
                }
              } catch (e) {
                report(e);
              }
            },
          });
        } catch (e) {
          report(e);
        }
      }, { once: true });
    };

    // co nejdriv (korenovy prvek vlozen, jeste pred prvnim vykreslenim) - zadne probliknuti sedych tlacitek
    Services.obs.addObserver({
      observe(doc) {
        try {
          if (doc && doc.documentURI === BROWSER && doc.defaultView) {
            if (enabled()) {
              set(doc.defaultView, true);
            }
            importHook(doc.defaultView);
          }
        } catch (e) {
          report(e);
        }
      },
    }, "document-element-inserted");
    Services.prefs.addObserver(PREF, {
      observe() {
        const on = enabled();
        for (const win of Services.wm.getEnumerator("navigator:browser")) {
          set(win, on);
        }
      },
    });
  })();
} catch (e) {
  try {
    Components.utils.reportError(e);
  } catch (e2) {}
}
