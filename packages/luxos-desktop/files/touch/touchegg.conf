<!-- luxos-touchegg 2: LuxOS gestures (luxos-touch copies this file to ~/.config/touchegg/ until you change it) -->
<touchégg>
  <settings>
    <property name="animation_delay">150</property>
    <property name="action_execute_threshold">20</property>
    <property name="color">auto</property>
    <property name="borderColor">auto</property>
  </settings>
  <application name="All">
    <!-- 3 fingers up: Launchpad (all apps), like the Dock button -->
    <gesture type="SWIPE" fingers="3" direction="UP">
      <action type="RUN_COMMAND">
        <repeat>false</repeat>
        <command>luxos-launchpad</command>
        <on>begin</on>
      </action>
    </gesture>
    <!-- 3 fingers down: show the desktop -->
    <gesture type="SWIPE" fingers="3" direction="DOWN">
      <action type="SHOW_DESKTOP">
        <animate>true</animate>
      </action>
    </gesture>
    <!-- 3 fingers left / right: next / previous workspace -->
    <gesture type="SWIPE" fingers="3" direction="LEFT">
      <action type="CHANGE_DESKTOP">
        <direction>next</direction>
        <animate>true</animate>
        <animationPosition>right</animationPosition>
      </action>
    </gesture>
    <gesture type="SWIPE" fingers="3" direction="RIGHT">
      <action type="CHANGE_DESKTOP">
        <direction>previous</direction>
        <animate>true</animate>
        <animationPosition>left</animationPosition>
      </action>
    </gesture>
    <!-- 4 fingers left / right: next / previous workspace as well - with an app open, three fingers often
         also scroll or select in the app; four fingers are not used by apps -->
    <gesture type="SWIPE" fingers="4" direction="LEFT">
      <action type="CHANGE_DESKTOP">
        <direction>next</direction>
        <animate>true</animate>
        <animationPosition>right</animationPosition>
      </action>
    </gesture>
    <gesture type="SWIPE" fingers="4" direction="RIGHT">
      <action type="CHANGE_DESKTOP">
        <direction>previous</direction>
        <animate>true</animate>
        <animationPosition>left</animationPosition>
      </action>
    </gesture>
    <!-- 4 fingers up: on-screen keyboard -->
    <gesture type="SWIPE" fingers="4" direction="UP">
      <action type="RUN_COMMAND">
        <repeat>false</repeat>
        <command>luxos-touch osk toggle</command>
        <on>begin</on>
      </action>
    </gesture>
    <!-- 3 fingers pinch in: close the window -->
    <gesture type="PINCH" fingers="3" direction="IN">
      <action type="CLOSE_WINDOW">
        <animate>true</animate>
        <color>F84A53</color>
        <borderColor>F84A53</borderColor>
      </action>
    </gesture>
    <!-- tap with 2 fingers: right click (context menu) -->
    <gesture type="TAP" fingers="2">
      <action type="MOUSE_CLICK">
        <button>3</button>
        <on>begin</on>
      </action>
    </gesture>
  </application>
  <!-- Firefox and Chromium zoom with 2 fingers themselves -->
</touchégg>
