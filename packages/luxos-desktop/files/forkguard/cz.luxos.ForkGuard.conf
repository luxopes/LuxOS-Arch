<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- LuxOS - upozorneni pojistek (luxos-forkguard, earlyoom -n) prijima luxos-hub z systemove sbernice.
     Oba posilaji signal z kratkeho spojeni bez jmena, takze hub odesilatele overit nestihne a filtr
     podle jmena nejde. Signal tedy smi poslat jen pojistka: forkguard bezi jako root, earlyoom jako
     DynamicUser s doplnkovou skupinou proc (dbus-broker bere skupiny ze SO_PEERGROUPS). Jinak by
     kterykoli lokalni uzivatel mohl jinemu ukazat kriticke oznameni s vlastnim textem. -->
<busconfig>
  <policy context="default">
    <deny send_type="signal" send_interface="cz.luxos.ForkGuard"/>
    <deny send_type="signal" send_interface="net.nuetzlich.SystemNotifications"/>
  </policy>
  <policy user="root">
    <allow send_type="signal" send_interface="cz.luxos.ForkGuard"/>
    <allow send_type="signal" send_interface="net.nuetzlich.SystemNotifications"/>
  </policy>
  <policy group="proc">
    <allow send_type="signal" send_interface="net.nuetzlich.SystemNotifications"/>
  </policy>
</busconfig>
