# LuxOS - kompozitor picom: stiny a animace oken (minimalizace do Docku jako v macOS)
backend = "glx";
vsync = true;
use-damage = true;
unredir-if-possible = true;

shadow = true;
shadow-radius = 22;
shadow-opacity = 0.32;
shadow-offset-x = -22;
shadow-offset-y = -14;

fading = false;
corner-radius = 0;

rules = (
  { match = "window_type = 'dock' || window_type = 'desktop' || window_type = 'dnd' || class_g = 'Plank' || class_g = 'Xfce4-panel'"; shadow = false; animations = (); },
  { match = "window_type = 'menu' || window_type = 'dropdown_menu' || window_type = 'popup_menu' || window_type = 'tooltip' || window_type = 'combo'"; shadow = false; animations = (); },
  # okna s vlastnimi stiny a zaoblenim (GTK hlavicky, Ovladaci centrum, Kalendar, oznameni)
  { match = "_GTK_FRAME_EXTENTS@ || class_g = 'Luxos-control-center' || class_g = 'Luxos-calendar' || class_g = 'Xfce4-notifyd'"; shadow = false; },
  # okna s ramem xfwm4: zaoblene rohy jako v macOS
  { match = "window_type = 'normal' && !_GTK_FRAME_EXTENTS@"; corner-radius = 10; },
);

animations = (
  # minimalizace: okno se zmensi a odleti k Docku (stred spodniho okraje monitoru); obnoveni opacne
  { triggers = ["hide"];
    scale-x = { curve = "cubic-bezier(0.4, 0, 0.6, 1)"; duration = 0.32; start = 1; end = 0.06; };
    scale-y = "scale-x";
    offset-x = { curve = "cubic-bezier(0.4, 0, 0.6, 1)"; duration = 0.32; start = 0;
                 end = "window-monitor-x + window-monitor-width / 2 - window-x - window-width * 0.03"; };
    offset-y = { curve = "cubic-bezier(0.5, 0, 0.9, 0.6)"; duration = 0.32; start = 0;
                 end = "window-monitor-y + window-monitor-height - window-y - window-height * 0.06"; };
    opacity = { curve = "cubic-bezier(0.6, 0, 1, 1)"; duration = 0.32; start = 1; end = 0; };
    shadow-opacity = "opacity"; shadow-scale-x = "scale-x"; shadow-scale-y = "scale-y";
    shadow-offset-x = "offset-x"; shadow-offset-y = "offset-y";
  },
  { triggers = ["show"];
    scale-x = { curve = "cubic-bezier(0.2, 0.8, 0.3, 1)"; duration = 0.30; start = 0.06; end = 1; };
    scale-y = "scale-x";
    offset-x = { curve = "cubic-bezier(0.2, 0.8, 0.3, 1)"; duration = 0.30; end = 0;
                 start = "window-monitor-x + window-monitor-width / 2 - window-x - window-width * 0.03"; };
    offset-y = { curve = "cubic-bezier(0.1, 0.5, 0.4, 1)"; duration = 0.30; end = 0;
                 start = "window-monitor-y + window-monitor-height - window-y - window-height * 0.06"; };
    opacity = { curve = "cubic-bezier(0, 0, 0.4, 1)"; duration = 0.30; start = 0; end = 1; };
    shadow-opacity = "opacity"; shadow-scale-x = "scale-x"; shadow-scale-y = "scale-y";
    shadow-offset-x = "offset-x"; shadow-offset-y = "offset-y";
  },
  # otevreni a zavreni: kratke zvetseni/zmenseni s prolnutim
  { triggers = ["open"]; preset = "appear"; scale = 0.9; duration = 0.18; },
  { triggers = ["close"]; preset = "disappear"; scale = 0.9; duration = 0.14; },
);
