      <stop offset="0" stop-color="#5b9bff"/>
      <stop offset="1" stop-color="#6a4dff"/>
    </linearGradient>
  </defs>
  <rect x="32" y="32" width="448" height="448" rx="100" fill="url(#bg)"/>
  <g fill="#fff">
