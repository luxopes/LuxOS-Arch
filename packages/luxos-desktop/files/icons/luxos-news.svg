<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Novinky LuxOS: megafon na modrem prechodu (styl ikon LuxOS). Rukojet vychazi z tela megafonu (prekryv), bez mezery. -->
  <defs>
