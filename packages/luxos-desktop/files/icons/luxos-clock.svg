<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Hodiny LuxOS: ciferník na teplém přechodu (vlastní kresba, styl ikon LuxOS); ručičky 10:10 -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#ffb35c"/>
      <stop offset="0.55" stop-color="#ff7a3d"/>
      <stop offset="1" stop-color="#f2506b"/>
    </linearGradient>
    <linearGradient id="dial" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f1f1f6"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffd9c4" stop-opacity="0.6"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#8a1f2c" flood-opacity="0.35"/>
    </filter>
    <filter id="hand" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#1d1d27" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect x="40" y="40" width="432" height="432" rx="100" fill="url(#bg)"/>
  <rect x="40" y="40" width="432" height="216" rx="100" fill="#ffffff" opacity="0.10"/>
  <!-- ciferník se světlým okrajem -->
  <g filter="url(#sh)">
    <circle cx="256" cy="256" r="158" fill="url(#rim)"/>
    <circle cx="256" cy="256" r="148" fill="url(#dial)"/>
  </g>
  <!-- čárky: 12 hodin, hlavní (12, 3, 6, 9) delší -->
  <g stroke="#1d1d27" stroke-linecap="round" transform="translate(256 256)">
    <g stroke-width="10" opacity="0.85">
      <path d="M0-132v28M132 0h-28M0 132v-28M-132 0h28"/>
    </g>
    <g stroke-width="6" opacity="0.35">
      <path d="M0-132v16" transform="rotate(30)"/>
      <path d="M0-132v16" transform="rotate(60)"/>
      <path d="M0-132v16" transform="rotate(120)"/>
      <path d="M0-132v16" transform="rotate(150)"/>
      <path d="M0-132v16" transform="rotate(210)"/>
      <path d="M0-132v16" transform="rotate(240)"/>
      <path d="M0-132v16" transform="rotate(300)"/>
      <path d="M0-132v16" transform="rotate(330)"/>
    </g>
  </g>
  <!-- ručičky: hodinová na 10, minutová na 2 (10:10), vteřinová oranžová -->
  <g filter="url(#hand)" stroke-linecap="round" transform="translate(256 256)">
    <path d="M0 0v-74" stroke="#1d1d27" stroke-width="16" transform="rotate(-55)"/>
    <path d="M0 0v-108" stroke="#1d1d27" stroke-width="11" transform="rotate(60)"/>
    <path d="M0 28v-126" stroke="#ff6a2b" stroke-width="5" transform="rotate(200)"/>
  </g>
  <circle cx="256" cy="256" r="13" fill="#ff6a2b"/>
  <circle cx="256" cy="256" r="5" fill="#ffffff"/>
</svg>
