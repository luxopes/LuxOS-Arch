<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- LuxOS - vychozi pisma: Inter (UI), Noto (zaloha), JetBrains Mono (terminal) -->
<fontconfig>
  <alias binding="same">
    <family>sans-serif</family>
    <prefer><family>Inter</family><family>Noto Sans</family><family>Noto Color Emoji</family></prefer>
  </alias>
  <alias binding="same">
    <family>serif</family>
    <prefer><family>Noto Serif</family><family>Noto Color Emoji</family></prefer>
  </alias>
  <alias binding="same">
    <family>monospace</family>
    <prefer><family>JetBrainsMono Nerd Font</family><family>JetBrains Mono</family><family>Noto Sans Mono</family></prefer>
  </alias>
  <!-- Pisma macOS a Windows nahradit podobnymi -->
  <alias><family>SF Pro Text</family><prefer><family>Inter</family></prefer></alias>
  <alias><family>SF Pro Display</family><prefer><family>Inter</family></prefer></alias>
  <alias><family>-apple-system</family><prefer><family>Inter</family></prefer></alias>
  <alias><family>Helvetica Neue</family><prefer><family>Inter</family></prefer></alias>
  <alias><family>SF Mono</family><prefer><family>JetBrains Mono</family></prefer></alias>
  <alias><family>Menlo</family><prefer><family>JetBrains Mono</family></prefer></alias>
  <match target="font">
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="hinting" mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintslight</const></edit>
    <edit name="rgba" mode="assign"><const>rgb</const></edit>
    <edit name="lcdfilter" mode="assign"><const>lcddefault</const></edit>
  </match>
</fontconfig>
