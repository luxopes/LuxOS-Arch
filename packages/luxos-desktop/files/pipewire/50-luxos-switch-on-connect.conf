# LuxOS: nove pripojene zvukove zarizeni (Bluetooth sluchatka, USB, HDMI) se hned stane vystupem
# i vstupem - jako v macOS. Po odpojeni se zvuk vrati na predchozi zarizeni.
# Virtualni zarizeni modul vynechava sam (ignore_virtual je vychozi).
pulse.cmd = [
    { cmd = "load-module" args = "module-switch-on-connect" flags = [ "nofail" ] }
]
