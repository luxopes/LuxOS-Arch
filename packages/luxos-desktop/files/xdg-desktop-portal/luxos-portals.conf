# LuxOS - portaly relace na Waylandu (XDG_CURRENT_DESKTOP=LuxOS): snimek a sdileni obrazovky pres wlroots
# (xdg-desktop-portal-wlr, privilegovany program v /usr/share/luxwm/privileged.conf), ostatni GTK (vyber souboru,
# tisk, nastaveni vzhledu). X11 relace (XFCE) bere vychozi konfiguraci.
[preferred]
default=gtk
org.freedesktop.impl.portal.Screenshot=wlr
org.freedesktop.impl.portal.ScreenCast=wlr
org.freedesktop.impl.portal.Secret=gnome-keyring
