# LuxOS - LightDM s prihlasovaci obrazovkou lightdm-gtk-greeter (formular uprostred jako v macOS)
[Seat:*]
greeter-session=lightdm-gtk-greeter
user-session=xfce
greeter-wrapper=/usr/lib/luxos/lightdm/luxos-greeter-wrapper
greeter-setup-script=/usr/lib/luxos/lightdm/luxos-greeter-setup
session-setup-script=/usr/lib/luxos/lightdm/luxos-session-setup
