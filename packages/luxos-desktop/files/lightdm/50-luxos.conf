# LuxOS - LightDM s prihlasovaci obrazovkou lightdm-gtk-greeter (formular uprostred jako v macOS)
[LightDM]
# Prevzit VT 1 od splashe (Plymouth) a navazat na jeho posledni snimek bez cerne mezery
minimum-vt=1

[Seat:*]
greeter-session=lightdm-gtk-greeter
# X server ponecha posledni snimek splashe, dokud se nevykresli prihlasovaci obrazovka
xserver-command=X -background none
user-session=xfce
session-setup-script=/usr/lib/luxos/lightdm/luxos-session-setup
