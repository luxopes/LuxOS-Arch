# LuxOS - prihlasovaci obrazovka (formular uprostred, lista nahore)
[greeter]
background=/usr/share/backgrounds/luxos/luxos-dark.jpg
user-background=false
theme-name=WhiteSur-Dark
icon-theme-name=WhiteSur-dark
cursor-theme-name=WhiteSur-cursors
cursor-theme-size=24
font-name=Inter 11
xft-antialias=true
xft-hintstyle=hintslight
xft-rgba=rgb
default-user-image=#avatar-default
round-user-image=true
hide-user-image=false
position=50%,center 46%,center
panel-position=top
indicators=~host;~spacer;~a11y;~clock;~power
clock-format=%a %-d. %b  %H:%M
keyboard=
reader=
screensaver-timeout=60
