# LuxOS - touchpad: klepnuti = klik, klepnuti dvema prsty = prave tlacitko,
# posouvani tazenim po pravem (a dolnim) okraji touchpadu
Section "InputClass"
    Identifier "LuxOS touchpad"
    MatchIsTouchpad "on"
    Driver "libinput"
    Option "Tapping" "on"
    Option "TapButtonMap" "lrm"
    Option "TappingDrag" "on"
    Option "ScrollMethod" "edge"
    # u posouvani na okraji je prirozeny smer: prst dolu = obsah dolu
    Option "NaturalScrolling" "false"
    Option "ClickMethod" "clickfinger"
    Option "DisableWhileTyping" "on"
    Option "AccelProfile" "adaptive"
EndSection
