# LuxOS - touchpad jako na Macu: tap-to-click, prirozene posouvani, klik dvema prsty = prave tlacitko
Section "InputClass"
    Identifier "LuxOS touchpad"
    MatchIsTouchpad "on"
    Driver "libinput"
    Option "Tapping" "on"
    Option "TappingDrag" "on"
    Option "NaturalScrolling" "true"
    Option "ClickMethod" "clickfinger"
    Option "DisableWhileTyping" "on"
    Option "AccelProfile" "adaptive"
EndSection
