# LuxOS - bamfdaemon (pouziva ho Dock) jen pri dostupnem X serveru. Pri odhlaseni ho D-Bus znovu
# spousti klienti konci relace, zatimco LightDM uz zmenil autorizaci X: bamfdaemon padal na
# "cannot open display" a journal mel pri kazdem prihlaseni ~6x "Failed to start BAMF".
# ExecCondition s neuspechem (exit 1) start jen preskoci (ne chyba).
[Service]
ExecCondition=/bin/sh -c 'exec xset q >/dev/null 2>&1'
