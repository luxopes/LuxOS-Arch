# LuxOS - oznameni z matneho skla jako widgety na plose: GTK modul luxos-glass (files/src/luxos-glass.c)
# kresli pod okna oznameni rozostrenou tapetu. Modul se prida k GTK_MODULES z relace (canberra apod.
# zustanou), proto ExecStart pres sh a ne Environment=. Bez modulu (smazany soubor) oznameni
# zustanou podle motivu.
# Modul luxos-notifyd (files/src/luxos-notifyd.c): historie oznameni synchronizovana s aplikacemi -
# oznameni zavrene aplikaci z historie zmizi, klik v okne Oznameni vyvola vychozi akci aplikace.
[Service]
ExecStart=
ExecStart=/bin/sh -c 'GTK_MODULES="$${GTK_MODULES:+$$GTK_MODULES:}luxos-glass:luxos-notifyd" exec /usr/lib/xfce4/notifyd/xfce4-notifyd'
