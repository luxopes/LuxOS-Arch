# Distro specific overrides for LuxOS (packages/realmd, installed as realmd-distro.conf)
# LuxOS joins domains with "lux domain join" (luxos-domain: adcli + SSSD + own PAM/NSS setup);
# realmd is used for "realm discover" and "realm list". Nothing is installed automatically.
[service]
automatic-install = no

[paths]
adcli = /usr/bin/adcli
net = /usr/bin/net
winbindd = /usr/bin/winbindd
smb.conf = /etc/samba/smb.conf
sssd.conf = /etc/sssd/sssd.conf
krb5.conf = /etc/krb5.conf

[active-directory]
default-client = sssd
os-name = LuxOS

[providers]
sssd = yes
samba = no

[sssd-packages]
sssd = /usr/bin/sssd
sssd-tools = /usr/bin/sss_cache

[adcli-packages]
adcli = /usr/bin/adcli

[commands]
# PAM and NSS are set up by luxos-domain (lux domain join / repair), not by realmd
sssd-enable-logins =
sssd-disable-logins =
sssd-enable-service = /usr/bin/systemctl enable sssd.service
sssd-disable-service = /usr/bin/systemctl disable sssd.service
sssd-restart-service = /usr/bin/systemctl restart sssd.service
sssd-stop-service = /usr/bin/systemctl stop sssd.service
sssd-caches-flush = /usr/bin/sss_cache --users --groups --netgroups --services --autofs-maps
name-caches-flush =

[users]
default-shell = /usr/bin/lsh
default-home = /home/%U
