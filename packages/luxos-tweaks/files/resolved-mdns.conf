# LuxOS - mDNS (pocitac.local, hledani tiskaren, LuxDrop, Companion) dela jen Avahi. Kdyz bezi i
# systemd-resolved (live ISO ho ma zapnuty presetem systemd), hlasily by se jmeno a sluzby dvakrat:
# Avahi pak varuje "Detected another IPv4 mDNS stack" a prejmenuje pocitac na "luxos-2".
[Resolve]
MulticastDNS=no
