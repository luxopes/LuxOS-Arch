# LuxOS - limit procesu a vlaken jednoho uzivatele (vsechny jeho relace a sluzby) podle RAM.
# Systemd ma 33 % maxima jadra (threads-max, ~7,9 na 1 MB RAM: 16 GB -> ~40 000). Proces fork bomby
# stoji 0,25 MB (bash -c) az 0,83 MB (bomba napsana v interaktivnim lsh v Terminalu - kopie velkeho
# shellu), namereno ve VM; polovina je pamet jadra, ktera nejde do swapu. 33 % tak dovolilo bombe zabrat
# vic nez celou RAM - na 16 GB s Firefoxem a Steamem se vycerpala RAM i zram a pocitac zamrzl
# (5. 11. 2026, tvrdy restart). 8 % (16 GB -> ~9 700, 3 GB -> ~1 800) je i v nejhorsim pripade ~2/3 RAM
# a jen kdyz bomba bezi na vic mistech; jedna relace ma 5 % (tasks-session.conf). Bezna plocha ma
# stovky az nizke tisice vlaken. Bombu samu zastavi luxos-forkguard (luxos-desktop) hned, jak narazi na
# limit; tento limit je zaloha, kdyby nestihl.
[Slice]
TasksMax=8%
