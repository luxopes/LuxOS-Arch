# LuxOS - pojistka proti zamrznuti pri nedostatku pameti (earlyoom)
# Kdyz volna RAM klesne pod 4 % a zaroven volny swap (zram) pod 8 %, slusne ukonci (SIGTERM)
# proces, ktery pameti zabira nejvic; pod 2 % a 4 % ho ukonci natvrdo (SIGKILL).
# Chranene: graficky server, prihlaseni, horni lista, Dock, zvuk, sit, D-Bus.
# Prednostne: karty a procesy prohlizecu, Electron/Node/Java, virtualni pocitace.
# Upozorneni posila signal na systemove sbernici (-n), zobrazi ho luxos-hub.
[Service]
ExecStart=
ExecStart=/usr/bin/earlyoom -m 4,2 -s 8,4 -r 0 -n \
    --avoid "^(Xorg|Xwayland|lightdm|systemd.*|xfce4-session|xfwm4|xfce4-panel|xfdesktop|xfsettingsd|wrapper-2.0|plank|luxos-hub|luxos-menubar|luxos-greeter|pipewire.*|wireplumber|NetworkManager|wpa_supplicant|dbus-.*|at-spi-bus-laun|at-spi2-registr|polkitd|udisksd|sshd|earlyoom)$$" \
    --prefer "^(Web Content|Isolated Web Co|WebExtensions|RDD Process|chromium|chrome|electron|code|node|java|qemu-system-x86)$$"
