# LuxOS - pojistka proti zamrznuti pri nedostatku pameti (earlyoom)
# Kdyz volna RAM klesne pod 4 % a zaroven volny swap (zram) pod 8 %, slusne ukonci (SIGTERM)
# proces s nejvyssim oom_score; pod 2 % a 4 % ho ukonci natvrdo (SIGKILL).
# Chranene (--avoid, oom_score -300): graficky server, prihlaseni, horni lista a jeji zasuvne moduly,
# Dock, zvuk, sit, D-Bus a male sluzby sezeni (oznameni, nastaveni Xfce, sprava napajeni, zamek
# obrazovky, klicenka, portaly, gvfs, dconf). Vsechny sluzby uzivatele maji od systemd
# oom_score_adj 200, takze 3-15 MiB velka sluzba mela vyssi skore nez 4 GB hra (adj 0) a earlyoom
# postupne ukoncil desitky malych sluzeb (oznameni 5x za 2 s), ktere pamet neuvolnily, ale
# rozbily sezeni. Chranene procesy lze ukoncit dal, jen kdyz opravdu zabiraji nejvic pameti.
# Prednostne (--prefer, +300): karty a procesy prohlizecu, Steam (steamwebhelper), Electron/Node/Java,
# virtualni pocitace.
# Upozorneni posila signal na systemove sbernici (-n), zobrazi ho luxos-hub.
# Seznamy porovnava earlyoom s /proc/PID/comm (nejvys 15 znaku). Test: tests/test-earlyoom.sh
[Service]
ExecStart=
ExecStart=/usr/bin/earlyoom -m 4,2 -s 8,4 -r 0 -n \
    --avoid "^(Xorg|Xwayland|lightdm|systemd.*|xfce4-session|xfwm4|xfce4-panel|xfdesktop|xfsettingsd|wrapper-2.0|plank|luxos-hub|luxos-menubar|luxos-greeter|pipewire.*|wireplumber|NetworkManager|wpa_supplicant|dbus-.*|at-spi-bus-laun|at-spi2-registr|polkitd|udisksd|sshd|earlyoom|xfce4-notifyd|xfconfd|xfce4-power-man|xfce4-screensav|light-locker|xfce-polkit|polkit-gnome-au|gnome-keyring-d|dconf-service|xdg-desktop-por|xdg-document-po|xdg-permission-|flatpak-portal|flatpak-session|gvfsd.*|gvfs-.*|bamfdaemon|nm-applet|upowerd|bluetoothd)$$" \
    --prefer "^(Web Content|Isolated Web Co|WebExtensions|RDD Process|chromium|chrome|electron|code|node|java|qemu-system-x86|steamwebhelper|WebKitWebProces)$$"
