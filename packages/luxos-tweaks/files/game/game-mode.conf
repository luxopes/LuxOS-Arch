# LuxOS - Herni rezim (luxos-game-mode.service). Po zmene: systemctl reload luxos-game-mode
# Zapnuty automaticky, kdyz bezi hra (Steam, Wine/Proton, gamescope, `luxos-game run PROGRAM`)
ENABLED=yes
# Zkomprimovat pamet programu na pozadi do zram, dokud neni volnych RECLAIM_TARGET % RAM
RECLAIM=yes
RECLAIM_TARGET=50
# Profil napajeni Vykon behem hry (ne pri zapnutem Sporici baterie)
PERFORMANCE=yes
# Nerusit v oznamenich behem hry
QUIET=yes
# Dalsi hry (nazvy programu oddelene mezerou), napr. GAMES=supertuxkart minecraft-launcher
GAMES=
# Dalsi sluzby, ktere pockaji na konec hry (vzory systemd), napr. FREEZE=myjob.service
FREEZE=
