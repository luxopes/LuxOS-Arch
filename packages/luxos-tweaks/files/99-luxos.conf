# LuxOS - ladeni pro svizny desktop
# zram: swap v RAM je levny, proto vyssi swappiness a bez read-ahead
vm.swappiness = 180
vm.page-cluster = 0
vm.watermark_boost_factor = 0
vm.watermark_scale_factor = 125
# Mene agresivni uvolnovani cache adresaru a inode
vm.vfs_cache_pressure = 50
# Kratsi zapisove davky - mene zaseku pri kopirovani velkych souboru
vm.dirty_bytes = 268435456
vm.dirty_background_bytes = 67108864
# Watchdog neni na desktopu potreba (setri preruseni)
kernel.nmi_watchdog = 0
# Rychlejsi sit
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr
net.ipv4.tcp_fastopen = 3
# Vice inotify sledovani (IDE, synchronizace souboru)
fs.inotify.max_user_watches = 524288
