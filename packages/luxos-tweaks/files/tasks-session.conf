# LuxOS - limit procesu jedne prihlasovaci relace (session-N.scope: plocha a vse spustene z ni mimo
# sluzby - Dock, spoustec, stara okna terminalu, jine terminaly) pod limitem uzivatele (8 %): fork bomba
# na plose zabere nejvys ~1/3 RAM (16 GB -> ~6 000 vlaken po 0,25-0,83 MB) a nevycerpa cely limit
# uzivatele, takze dal funguje Terminal (luxos-terminal2.service) i nove prihlaseni stejneho uzivatele
# na konzoli (Ctrl+Alt+F3, luxos-unfreeze). Plocha s prohlizecem a hrou ve Steamu ma ~1 000-3 000 vlaken
# (3 GB RAM -> limit ~1 150, Firefox s plochou ~550).
[Scope]
TasksMax=5%
