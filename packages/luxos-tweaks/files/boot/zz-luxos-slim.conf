# LuxOS (luxos-tweaks) - hook "luxos-slim" do kazdeho systemd initramfs: zakazane (blacklist) moduly,
# ktere nejsou nactene, se z autodetekce vyradi (nouveau vedle ovladace NVIDIA i s firmwarem ~110 MB)
# a na plnem EFI oddilu se stary initramfs neprepise useknutym. Hned za "autodetect", jinak na konec.
# Live ISO (bez systemd hooku) ho nema.
if [[ " ${HOOKS[*]} " == *" systemd "* && " ${HOOKS[*]} " != *" luxos-slim "* ]]; then
    if [[ " ${HOOKS[*]} " == *" autodetect "* ]]; then
        _luxos_h=()
        for _luxos_x in "${HOOKS[@]}"; do
            _luxos_h+=("$_luxos_x")
            [[ $_luxos_x == autodetect ]] && _luxos_h+=(luxos-slim)
        done
        HOOKS=("${_luxos_h[@]}")
        unset _luxos_h _luxos_x
    else
        HOOKS+=(luxos-slim)
    fi
fi
