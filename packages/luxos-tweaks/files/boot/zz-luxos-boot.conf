# LuxOS (luxos-tweaks) - hook "luxos-boot" do kazdeho systemd initramfs: zprava pri spatnem hesle
# k disku, neomezene pokusy a pri neuspesnem startu zaznam na EFI oddilu. Live ISO (bez systemd
# hooku) ho nema.
if [[ " ${HOOKS[*]} " == *" systemd "* && " ${HOOKS[*]} " != *" luxos-boot "* ]]; then
    HOOKS+=(luxos-boot)
fi
