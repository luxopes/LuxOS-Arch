# LuxOS - kontrola zavadece Secure Boot (luxos-secureboot sync) nezdrzuje prihlasovaci obrazovku.
# Jednotka je WantedBy=multi-user.target a cil na sluzby, ktere chce, ceka (implicitni After=).
# Bezi s Nice=10 a IOSchedulingClass=idle, takze pri startu (disk vytizeny) trvala 6-9 s a o tolik
# se pozdrzel graphical.target: ve VM 8,8 s -> 3,2 s do prihlasovaci obrazovky. Bez vychozich
# zavislosti cil necha sluzbu dobehnout na pozadi; poradi pro vypnuti (ExecStop) zustava.
[Unit]
DefaultDependencies=no
After=sysinit.target
Conflicts=shutdown.target
Before=shutdown.target
