# LuxOS - planovac procesu (CPU scheduler)
#   lavd     scx_lavd (sched_ext): nizka latence pro okna, zvuk a hry; vychozi
#   default  normalni planovac jadra (EEVDF)
# Prepnuti: luxos-care scheduler lavd|default (system.lsl: kernel.scheduler = "lavd" | "default")
# Bez podpory sched_ext v jadre nebo pri opakovanem padu bezi vzdy planovac jadra.
SCHEDULER=lavd
# Dalsi volby pro scx_lavd, napr. ARGS=--autopower (rezim podle profilu napajeni misto zateze)
ARGS=
