# LuxOS - /tmp lezi na disku (luxos-tmp-setup), ne v pameti: pri kazdem startu se vyprazdni ("D"
# + --remove v systemd-tmpfiles-setup.service), behem behu se mazou soubory starsi 10 dni.
# Nahrazuje radek "q /tmp" z tmp.conf systemd (soubor s drivejsim jmenem ma prednost; systemd pak
# do zurnalu zapise "Duplicate line for path /tmp, ignoring" - to je v poradku). Slozky X11
# (/tmp/.X11-unix ap.) znovu zalozi x11.conf systemd. /var/tmp se nemeni (30 dni, start nemaze).
D /tmp 1777 root root 10d
