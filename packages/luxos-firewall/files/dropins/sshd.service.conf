# LuxOS firewall: port SSH otevrit/zavrit hned pri systemctl start/stop sshd.service, nejen pri zapnuti
# (luxos-firewall-refresh.path hlida jen odkazy enable). --no-block: nezdrzet start sshd cekanim na firewall.
[Service]
ExecStartPost=-/usr/bin/systemctl --no-block try-reload-or-restart luxos-firewall.service
ExecStopPost=-/usr/bin/systemctl --no-block try-reload-or-restart luxos-firewall.service
