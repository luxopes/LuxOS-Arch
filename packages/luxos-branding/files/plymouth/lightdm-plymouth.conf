# LuxOS - LightDM prevezme obraz primo od splashe (jako GDM ve Fedore):
# plymouth-quit se nespusti (konflikt), LightDM sam zavola deactivate a quit --retain-splash.
# Dobehnuti progress baru (luxos-plymouth-finish.service) bezi uz po basic.target soubezne se
# startem site, ne az tady pred LightDM.
[Unit]
Conflicts=plymouth-quit.service
Wants=luxos-plymouth-finish.service
After=plymouth-quit.service plymouth-start.service luxos-plymouth-finish.service
OnFailure=plymouth-quit.service
