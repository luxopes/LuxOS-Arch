# LuxOS - sluzba polohy GeoClue pro Mapy (a LuxAI pres luxos-maps --json where-am-i)
# Poloha z Wi-Fi siti v okoli (BeaconDB, otevrena databaze; nic se neodesila zpet), jinak podle IP.
# Mapy se na souhlas zeptaji samy (jednou), proto bez agenta GeoClue (na Xfce zadny neni).

[wifi]
enable=true
url=https://api.beacondb.net/v1/geolocate
submit-data=false

[luxos-maps]
allowed=true
system=false
users=
