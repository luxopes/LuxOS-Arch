# LuxOS (lux-engine): klicenka je /etc/lux/keyring a nastroje jadra se jmenuji lux-engine-*
# (archlinux-keyring-wkd-sync vola "pacman-conf GPGDir" - spusti ho lux-engine-wkd-sync)
[Unit]
ConditionPathIsDirectory=
ConditionPathIsReadWrite=
ConditionPathIsDirectory=/etc/lux/keyring/
ConditionPathIsReadWrite=/etc/lux/keyring/

[Service]
Environment=PATH=/usr/lib/lux/alpm/bin:/usr/local/sbin:/usr/local/bin:/usr/bin
ExecStart=
ExecStart=/usr/lib/lux/alpm/lux-engine-wkd-sync
ReadWritePaths=
ReadWritePaths=/etc/lux/keyring
