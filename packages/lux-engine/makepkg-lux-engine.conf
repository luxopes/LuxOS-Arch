# LuxOS (lux-engine): nastroje jadra lux (lux-engine, lux-engine-conf, lux-engine-key) jsou
# v /usr/lib/lux/alpm/bin, mimo PATH. makepkg je pro -s/-i/-r a kontrolu zamku databaze
# (lux-engine-conf) najde tady. Vlastni volbu lze dal zadat promennou prostredi PACMAN.
case ":$PATH:" in
    *:/usr/lib/lux/alpm/bin:*) ;;
    *) PATH="/usr/lib/lux/alpm/bin${PATH:+:$PATH}" ;;
esac
PACMAN=${PACMAN:-/usr/lib/lux/alpm/bin/lux-engine}
# sudo nastavi vlastni PATH: hooky a skriptlety po makepkg -s/-i (napr. mkinitcpio) nastroje jadra
# potrebuji take. Vlastni PACMAN_AUTH (makepkg.conf, ~/.makepkg.conf) ma prednost.
if [[ -z ${PACMAN_AUTH[*]-} ]] && type -p sudo >/dev/null; then
    PACMAN_AUTH=(sudo -k /usr/bin/env PATH=/usr/lib/lux/alpm/bin:/usr/local/sbin:/usr/local/bin:/usr/bin)
fi
