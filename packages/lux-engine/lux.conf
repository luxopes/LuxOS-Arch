# LuxOS - configuration of the lux package manager
#
# Format: one "key  value" per line, '#' starts a comment. Indented lines belong to the
# "repo NAME" line above them. Full reference: /usr/share/doc/lux/lux.md (or ask LuxAI).
# Check after editing:  lux config check
#
# Examples:
#   hold  linux-firmware            keep a package at its current version (lux update skips it)
#   repo myrepo                     add a repository (put it in /etc/lux/conf.d/myrepo.conf)
#       server  https://example.org/$repo/$arch
#   lux mirrors                     pick the fastest download mirrors (/etc/lux/mirrorlist)

architecture        auto
parallel-downloads  10
signatures          required      # required | optional | never (never only for local file:// repos)
local-signatures    optional      # packages installed from a file (AUR builds)
color               on
candy               on
check-space         on
verbose-lists       on
download-user       alpm
protect             lux-engine glibc

# lux itself
aur                 on            # packages from AUR (built on this computer)
review-pkgbuild     on            # offer to read the build script before building from AUR
flatpak             on            # lux update also updates Flatpak apps
clean-keep          2             # package versions kept in the cache by "lux clean"

# LuxOS repositories (packages signed with the key from luxos-keyring)
repo luxos
    server  https://luxos.lux-ai.cz/repo/$repo/$arch

repo luxos-apps
    server  https://luxos.lux-ai.cz/repo/$repo/$arch

# Arch Linux repositories (download mirrors: /etc/lux/mirrorlist)
repo core
    mirrors  /etc/lux/mirrorlist

repo extra
    mirrors  /etc/lux/mirrorlist

# more files in the same format (repositories added by packages or the administrator)
include  /etc/lux/conf.d/*.conf
