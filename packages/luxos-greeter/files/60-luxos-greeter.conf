# LuxOS - prihlasovaci obrazovka luxos-greeter (prepisuje lightdm-gtk-greeter z 50-luxos.conf).
# Greeter kresli vse v jednom okne a nepotrebuje kompozitor (xcompmgr) ani GTK modul z wrapperu.
# Pozor: prazdne "greeter-setup-script=" / "greeter-wrapper=" LightDM 1.33 nesnese (greeter
# se nespusti), proto neutralni prikazy: true nic nedela, env jen spusti greeter.
[Seat:*]
greeter-session=luxos-greeter
greeter-setup-script=/usr/bin/true
greeter-wrapper=/usr/bin/env
