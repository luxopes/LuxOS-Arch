# LuxOS - nastaveni prihlasovaci obrazovky (luxos-greeter)
[greeter]
# Tapeta, kdyz uzivatel zadnou nema (cesta citelna pro uzivatele lightdm); vychozi svetly rezim
background=/usr/share/backgrounds/luxos/luxos-light.jpg
# Tapeta uzivatele z AccountsService (BackgroundFile), pokud je citelna. LuxOS do ni zapisuje
# tapetu plochy (luxos-appearance greeter-sync), takze prihlasovaci obrazovka ukazuje stejnou.
# Bere se uzivatel vybrany pri startu (zamceny / posledni prihlaseny); pri prepinani uzivatelu
# se tapeta nemeni. false = vzdy tapeta z "background".
user-background=true
# Hodiny: auto = 24h pro cestinu a ostatni jazyky, 12h pro anglictinu; true/false vynuti
clock-24h=auto
# Vlastni formaty strftime (prazdne = podle jazyka, cs: "%A %-d. %B", en: "%A, %B %-d")
#clock-format=%-H:%M
#date-format=%A %-d. %B
# Po kolika sekundach necinnosti se vratit na hodiny
idle-timeout=30
font=Inter
cursor-theme=WhiteSur-cursors
show-battery=true
show-network=true
