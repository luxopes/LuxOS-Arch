# Programy, ktere luxwm pusti na privilegovane protokoly Waylandu: snimky obrazovky
# (screencopy, ext-image-copy-capture), schranka (data-control), sprava cizich oken
# (foreign-toplevel), virtualni klavesnice/ukazatel, sprava monitoru a zamek obrazovky.
# Absolutni cesty po radcich. Nikdy sem nepatri interprety (python, sh): povolily by kazdy skript.
# Aplikace v sandboxu (wp-security-context) privilegovane protokoly nedostanou nikdy.
# Kompromisy: docs/developers/luxcomp-api.md (Privilegovane protokoly).
# Cesta je skutecny program (/proc/PID/exe), ne spoustec: Dock spousti /usr/bin/luxos-dock skriptem.
/usr/bin/luxos-bar
/usr/lib/luxos/luxos-dock
/usr/lib/luxos/luxos-screenshot-ui
# zamek (WP-8) a Launchpad (WP-10) az budou: jmena podle planu 1.1.0
/usr/bin/luxos-lock
# hlidac zamku: overuje, ze kompozitor ext-session-lock ma (privilegovane globaly jinak nevidi)
/usr/lib/luxos/luxos-lock-session
/usr/bin/luxos-launchpad
/usr/bin/grim
# portal snimku a sdileni obrazovky (luxos-portals.conf: Screenshot, ScreenCast)
/usr/lib/xdg-desktop-portal-wlr
