# LuxOS - vychozi nastaveni luxwm (/usr/share/luxwm/luxwm.conf). Vlastni zmeny patri do
# ~/.config/luxwm/luxwm.conf: stejny tvar, prepisuje tento soubor po polozkach; prazdna hodnota
# zkratku vypne. Po zmene: kill -HUP luxwm (vzhled svetly/tmavy: kill -USR1).

workspaces = 4
# prejezd ploch v ms (0 = bez animace, "omezit pohyb"); vychozi je tokens.MOTION["workspace"]
slide_ms = 420
wrap_workspaces = no
# po pripojeni/odpojeni monitoru a pri startu: ulozene nastaveni monitoru pro tuto sadu (prazdne = nic)
displays_command = luxos-displays auto

[keys]
# Zkratky ve tvaru luxos-shortcuts / xfconf xfce4-keyboard-shortcuts; akce maji nazvy z xfwm4,
# "exec PRIKAZ" spusti program (sh -c). Super = Cmd jako v macOS. Poradi modifikatoru je jedno.
# Stejne zkratky jako vychozi xfce4-keyboard-shortcuts.xml X11 relace; bez nahrady na Waylandu zatim
# zustavaji <Primary><Alt>Delete a XF86PowerOff (odhlaseni).

# okna
<Super>q = close_window_key
<Alt>F4 = close_window_key
<Super>m = hide_window_key
<Super>h = hide_window_key
<Super>Down = hide_window_key
<Super>Up = maximize_window_key
<Super>Left = tile_left_key
<Super>Right = tile_right_key
<Primary><Super>f = fullscreen_key
F11 = fullscreen_key
<Super>d = show_desktop_key

# prepinani: Alt+Tab po oknech (konec pustenim Alt, Esc zrusi), Alt+` okna aktualni aplikace
<Alt>Tab = cycle_windows_key
<Alt><Shift>Tab = cycle_reverse_windows_key
<Super>Tab = cycle_windows_key
<Super><Shift>Tab = cycle_reverse_windows_key
<Alt>grave = cycle_app_windows_key
<Alt><Shift>grave = cycle_reverse_app_windows_key
<Super>grave = switch_window_key

# plochy
<Primary><Super>Left = left_workspace_key
<Primary><Super>Right = right_workspace_key
<Primary><Super>1 = workspace_1_key
<Primary><Super>2 = workspace_2_key
<Primary><Super>3 = workspace_3_key
<Primary><Super>4 = workspace_4_key
<Primary><Super><Shift>Left = move_window_left_workspace_key
<Primary><Super><Shift>Right = move_window_right_workspace_key
<Primary><Super><Shift>1 = move_window_workspace_1_key
<Primary><Super><Shift>2 = move_window_workspace_2_key
<Primary><Super><Shift>3 = move_window_workspace_3_key
<Primary><Super><Shift>4 = move_window_workspace_4_key

# programy
<Super>space = exec luxos-search
<Super>a = exec luxos-launchpad
XF86LaunchA = exec luxos-launchpad
<Super>comma = exec luxos-settings
<Super>l = exec loginctl lock-session
<Primary><Super>q = exec loginctl lock-session
<Super><Alt>Escape = exec luxos-monitor
<Super>t = exec luxos-terminal
<Primary><Alt>t = exec luxos-terminal
<Super>e = exec thunar
<Super>period = exec luxos-emoji
<Primary><Super>space = exec luxos-emoji
<Super><Shift>3 = exec luxos-screenshot --screen
<Super><Shift>4 = exec luxos-screenshot --portion
<Super><Shift>5 = exec luxos-screenshot
Print = exec luxos-screenshot
<Shift>Print = exec luxos-screenshot --portion
<Primary><Shift>Escape = exec luxos-monitor
XF86Calculator = exec luxos-calculator
# monitory: rychla volba rezimu (rozsirit, zrcadlit, jen externi, jen vestaveny) jako Win+P
<Super>p = exec luxos-displays menu
XF86Display = exec luxos-displays menu
