<!doctype html>
<!-- LuxOS - nahled odkazu 1200x630 (og:image, twitter:image). Vykresluje scripts/site-og/render-og.sh;
     texty se doplni podle jazyka (?lang=en|cs). Jen vlastni grafika LuxOS: logo, tapeta, snimek plochy. -->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  html,body{margin:0;width:1200px;height:630px;overflow:hidden}
  body{font-family:Inter,"Noto Sans",ui-sans-serif,system-ui,sans-serif;color:#f5f5ff;
    background:radial-gradient(ellipse 60% 70% at 70% 0%,#2a2f9a 0%,transparent 70%),
      radial-gradient(ellipse 50% 60% at 100% 100%,#4a2a9a99 0%,transparent 70%),
      linear-gradient(160deg,#0a0e24,#080b16 70%);position:relative}
  .orb{position:absolute;width:1100px;height:640px;top:-470px;left:260px;border-radius:48%;transform:rotate(19deg);
    background:linear-gradient(149deg,#080a20 42%,#4348ec 63%,#788cff 68%,#292c85 72%,#090d27 82%);
    box-shadow:0 22px 85px 2px #3948ff8c;opacity:.9}
  .copy{position:absolute;left:70px;top:0;bottom:0;width:470px;display:flex;flex-direction:column;justify-content:center}
  .brand{display:flex;align-items:center;gap:20px}
  .brand svg{width:104px;height:86px}
  .brand h1{font-size:92px;line-height:1;margin:0;font-weight:800;letter-spacing:-.045em;
    background:linear-gradient(95deg,#fff 30%,#a8b8ff 90%);-webkit-background-clip:text;color:transparent}
  .tag{font-size:33px;line-height:1.28;font-weight:650;letter-spacing:-.02em;margin:30px 0 26px;color:#e9ebff}
  .pills{display:flex;flex-wrap:wrap;gap:10px}
  .pills span{font-size:20px;font-weight:600;padding:9px 18px;border-radius:999px;background:#ffffff14;border:1px solid #ffffff2e;color:#dfe3ff}
  .pills span.cta{background:linear-gradient(110deg,#7785ff,#655afa);border-color:#9b9dff;color:#fff}
  .shot{position:absolute;right:-70px;top:120px;width:660px;border-radius:16px;overflow:hidden;
    box-shadow:0 0 0 2px #6871a180,0 30px 70px #000a,0 0 120px #3d47ff55}
  .shot img{display:block;width:100%}
  .url{position:absolute;left:70px;bottom:34px;font-size:20px;color:#a9afd8;letter-spacing:.01em}
</style>
</head>
<body>
<div class="orb"></div>
<div class="copy">
  <div class="brand">
    <svg viewBox="4 26 249 204" aria-hidden="true"><defs><linearGradient id="g" gradientUnits="userSpaceOnUse" x1="40" y1="30" x2="225" y2="230"><stop offset="0" stop-color="#7ab8ff"/><stop offset=".5" stop-color="#5b7cff"/><stop offset="1" stop-color="#a06bff"/></linearGradient></defs><path fill="url(#g)" d="M246.27 209.91C188.18 163.23 147.07 104.71 133.55 30.45C116.12 140.58 158.36 161.65 246.27 209.91ZM8.09 211.18C89.02 173.90 133.08 136.86 126.09 40.64C105.95 110.22 62.88 165.17 8.09 211.18ZM248.64 226.09C158.26 151.17 105.77 146.57 13.73 222.82C95.86 182.21 167.60 183.49 248.64 226.09Z"/></svg>
    <h1>LuxOS</h1>
  </div>
  <p class="tag" id="tag"></p>
  <div class="pills" id="pills"></div>
</div>
<div class="shot"><img id="shot" alt=""></div>
<div class="url">luxos.lux-ai.cz</div>
<script>
  const T = {
    en: {tag: "Fast, lightweight Linux with a macOS-like desktop", pills: ["Free", "Arch Linux based", "LuxAI assistant"], cta: "Download ISO", shot: "../../site/assets/shots/launchpad-dark-960.webp"},
    cs: {tag: "Rychlý a lehký Linux s\u00a0prostředím jako macOS", pills: ["Zdarma", "Na Arch Linuxu", "Asistent LuxAI"], cta: "Stáhnout ISO", shot: "../../site/assets/shots/cs/launchpad-dark-960.webp"}
  };
  const lang = new URLSearchParams(location.search).get("lang") === "cs" ? "cs" : "en";
  const t = T[lang];
  document.documentElement.lang = lang;
  document.getElementById("tag").textContent = t.tag;
  const pills = document.getElementById("pills");
  for (const p of t.pills) { const s = document.createElement("span"); s.textContent = p; pills.append(s); }
  const c = document.createElement("span"); c.className = "cta"; c.textContent = t.cta; pills.append(c);
  document.getElementById("shot").src = t.shot;
</script>
</body>
</html>
